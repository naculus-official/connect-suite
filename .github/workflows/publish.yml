name: Publish

# Publishing is manual. Each release group has its own job and tag prefix, so
# lib (lib/v<version>) and appkit (appkit/v<version>) can ship the same version
# without colliding. Order: preflight -> publish -> tag -> release.
#
# group = lib or appkit runs one job. group = both runs lib first and appkit
# only after lib succeeds, in this one run, because appkit depends on the lib
# version it is released with.
#
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Each package
# must trust this workflow and the npm-publish environment on npmjs.com.
#
# A dry run checks configuration only. It does not prove the release is safe:
# the registry and tag checks run only on a real publish.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Release group (both = lib, then appkit, in this run)'
        required: true
        type: choice
        options:
          - lib
          - appkit
          - both
      dry_run:
        description: 'Dry run (no actual publish)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  publish-lib:
    name: Publish lib
    if: ${{ inputs.group == 'lib' || inputs.group == 'both' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build lib
        run: pnpm run build:lib
      - name: Typecheck lib
        run: pnpm --dir packages/lib exec tsc --noEmit
      - name: Test lib
        run: pnpm run test:lib
      - name: Release notes
        working-directory: packages/lib
        run: |
          set -euo pipefail
          node --test scripts/release-notes.test.mjs
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Release preflight (dry run - configuration only)
        if: ${{ inputs.dry_run == 'true' }}
        working-directory: packages/lib
        run: node scripts/release-preflight.mjs --pre-bump
      - name: Release preflight
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/lib
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-preflight.mjs --expect "$VERSION"
      - name: Audit production dependencies
        run: pnpm audit --audit-level=critical
      - name: Publish lib packages
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm -r --filter "./packages/lib/packages/*" publish --dry-run --access public --no-git-checks --provenance
          else
            pnpm -r --filter "./packages/lib/packages/*" publish --access public --no-git-checks --provenance
          fi
      - name: Tag and release lib
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/lib
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git tag -a "lib/v$VERSION" -m "lib release v$VERSION"
          git push origin "lib/v$VERSION"
          gh release create "lib/v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-appkit:
    name: Publish appkit
    # No `needs`: this job starts at once so its approval is requested up front,
    # letting both groups be reviewed in one sitting. Before publishing, it waits
    # for the lib version to appear on npm (group both only).
    if: ${{ inputs.group == 'appkit' || inputs.group == 'both' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # appkit typechecks against the lib build output (its workspace deps), so
      # build the whole workspace, as ci.yml does, not only appkit.
      - name: Build workspace
        run: pnpm run build
      - name: Typecheck appkit
        run: pnpm --dir packages/appkit exec tsc --noEmit
      - name: Test appkit
        run: pnpm run test:appkit
      - name: Release notes
        working-directory: packages/appkit
        run: |
          set -euo pipefail
          node --test scripts/release-notes.test.mjs
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for lib on npm (both, real publish)
        if: ${{ inputs.group == 'both' && inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/lib/packages/core/package.json').version")
          for i in $(seq 1 120); do
            if npm view "@naculus/connect-core@$VERSION" version >/dev/null 2>&1; then
              echo "lib $VERSION is on npm"
              exit 0
            fi
            sleep 15
          done
          echo "lib $VERSION did not appear on npm within 30 minutes; not publishing appkit"
          exit 1
      - name: Release preflight (dry run - configuration only)
        if: ${{ inputs.dry_run == 'true' }}
        working-directory: packages/appkit
        run: node scripts/release-preflight.mjs --pre-bump
      - name: Release preflight
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/appkit
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-preflight.mjs --expect "$VERSION"
      - name: Audit production dependencies
        run: pnpm audit --audit-level=critical
      - name: Publish appkit packages
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm -r --filter "./packages/appkit/packages/*" publish --dry-run --access public --no-git-checks --provenance
          else
            pnpm -r --filter "./packages/appkit/packages/*" publish --access public --no-git-checks --provenance
          fi
      - name: Tag and release appkit
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/appkit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git tag -a "appkit/v$VERSION" -m "appkit release v$VERSION"
          git push origin "appkit/v$VERSION"
          gh release create "appkit/v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
