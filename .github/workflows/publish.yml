name: Publish

# Publishing is manual. Each release group has its own job and tag prefix, so
# lib (lib/v<version>) and appkit (appkit/v<version>) can ship the same version
# without colliding. Order: preflight -> publish -> tag -> release.
#
# A dry run checks configuration only. It does not prove the release is safe:
# the registry and tag checks run only on a real publish.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Release group'
        required: true
        type: choice
        options:
          - lib
          - appkit
      dry_run:
        description: 'Dry run (no actual publish)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  publish-lib:
    name: Publish lib
    if: ${{ inputs.group == 'lib' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build lib
        run: pnpm run build:lib
      - name: Typecheck lib
        run: pnpm --dir packages/lib exec tsc --noEmit
      - name: Test lib
        run: pnpm run test:lib
      - name: Release notes
        working-directory: packages/lib
        run: |
          set -euo pipefail
          node --test scripts/release-notes.test.mjs
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Release preflight (dry run - configuration only)
        if: ${{ inputs.dry_run == 'true' }}
        working-directory: packages/lib
        run: node scripts/release-preflight.mjs --pre-bump
      - name: Release preflight
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/lib
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-preflight.mjs --expect "$VERSION"
      - name: Audit production dependencies
        run: pnpm audit --audit-level=critical
      - name: Publish lib packages
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm -r --filter "./packages/lib/packages/*" publish --dry-run --access public --no-git-checks --provenance
          else
            pnpm -r --filter "./packages/lib/packages/*" publish --access public --no-git-checks --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and release lib
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/lib
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git tag -a "lib/v$VERSION" -m "lib release v$VERSION"
          git push origin "lib/v$VERSION"
          gh release create "lib/v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-appkit:
    name: Publish appkit
    if: ${{ inputs.group == 'appkit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build appkit
        run: pnpm run build:appkit
      - name: Typecheck appkit
        run: pnpm --dir packages/appkit exec tsc --noEmit
      - name: Test appkit
        run: pnpm run test:appkit
      - name: Release notes
        working-directory: packages/appkit
        run: |
          set -euo pipefail
          node --test scripts/release-notes.test.mjs
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Release preflight (dry run - configuration only)
        if: ${{ inputs.dry_run == 'true' }}
        working-directory: packages/appkit
        run: node scripts/release-preflight.mjs --pre-bump
      - name: Release preflight
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/appkit
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-preflight.mjs --expect "$VERSION"
      - name: Audit production dependencies
        run: pnpm audit --audit-level=critical
      - name: Publish appkit packages
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm -r --filter "./packages/appkit/packages/*" publish --dry-run --access public --no-git-checks --provenance
          else
            pnpm -r --filter "./packages/appkit/packages/*" publish --access public --no-git-checks --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and release appkit
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: packages/appkit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git tag -a "appkit/v$VERSION" -m "appkit release v$VERSION"
          git push origin "appkit/v$VERSION"
          gh release create "appkit/v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
