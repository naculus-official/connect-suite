name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=critical

      - name: Build all packages
        run: pnpm -r build

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:run

      # After the build: these read the built packages.
      - name: Public API surface unchanged (api-surface/)
        run: pnpm api:check

      - name: Critical helpers have one owner
        run: pnpm helpers:check

      - name: Bundle size budget
        run: pnpm size:check

      - name: Lint
        run: pnpm lint

      - name: Spell check
        run: pnpm spell-check

      - name: Duplication threshold
        run: pnpm dup:check

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
