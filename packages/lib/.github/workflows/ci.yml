name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=critical

      - name: Build packages first (needed for dist/ resolution)
        run: pnpm -r build

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test:run

      # After the build: these read the built packages.
      - name: Public API surface unchanged (api-surface/)
        run: pnpm api:check

      - name: Critical helpers have one owner
        run: pnpm helpers:check

      - name: Bundle size budget
        run: pnpm size:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Spell check
        run: pnpm spell-check

      - name: Duplication threshold
        run: pnpm dup:check

      - name: Dependencies declared and used
        run: pnpm deps:check

      - name: Check changeset
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx changeset status --since=main 2>/dev/null || echo "⚠️  No changeset found — run 'pnpm changeset' to document API/behavior changes"
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages first (needed for dist/ resolution)
        run: pnpm -r build

      - name: Run coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: ./coverage/

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
